openapi: 3.0.3
info:
  title: Jungle Wallet and Wagering API
  version: 1.0.0
  description: |-
    API para carteiras e operações de wagering. Valores monetários são strings
    decimais com duas casas e moeda explícita. As rotas protegidas usam tokens
    Bearer emitidos pelo realm `jungle` do Keycloak.
servers:
  - url: http://localhost:8088
    description: Ambiente local (kind)
tags:
  - name: Health
  - name: Wallets
  - name: Wagering
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Verifica se o processo está ativo
      security: []
      responses:
        '200':
          description: Processo ativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Verifica se as dependências necessárias estão disponíveis
      security: []
      responses:
        '200':
          description: Aplicação pronta para receber tráfego
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Aplicação ainda não está pronta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /metrics:
    get:
      tags: [Health]
      operationId: getMetrics
      summary: Exporta métricas Prometheus do processo
      security: []
      responses:
        '200':
          description: Métricas em texto Prometheus
          content:
            text/plain:
              schema:
                type: string
      description: Na API o endpoint está na porta HTTP principal; os workers expõem o mesmo caminho na porta 9090.
  /wallets:
    post:
      tags: [Wallets]
      operationId: openWallet
      summary: Abre uma carteira
      description: Requer token do cliente interno. É permitida uma carteira por jogador e moeda.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenWalletRequest'
            example:
              playerId: 0192f28f-5dc0-7d58-bdb2-814ad6a0f4a1
              initialBalance:
                amount: '100.00'
                currency: BRL
      responses:
        '201':
          description: Carteira criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenWalletResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /wallets/{walletID}:
    parameters:
      - $ref: '#/components/parameters/WalletID'
    get:
      tags: [Wallets]
      operationId: getWallet
      summary: Consulta uma carteira
      description: Tokens internos podem consultar qualquer carteira; tokens de jogador só podem consultar a própria.
      responses:
        '200':
          description: Carteira encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /wallets/{walletID}/ledger:
    parameters:
      - $ref: '#/components/parameters/WalletID'
    get:
      tags: [Wallets]
      operationId: listWalletLedger
      summary: Lista lançamentos da carteira
      description: Retorna lançamentos em ordem estável usando cursor opaco para paginação.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Cursor retornado em `nextCursor` na página anterior.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Quantidade de itens por página (padrão 50; mínimo 1, máximo 500).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: Página de lançamentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /wallets/{walletID}/reconciliation:
    parameters:
      - $ref: '#/components/parameters/WalletID'
    post:
      tags: [Wallets]
      operationId: reconcileWallet
      summary: Compara saldo armazenado com o ledger
      description: Operação somente de leitura; não modifica o saldo nem os lançamentos.
      responses:
        '200':
          description: Resultado da reconciliação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reconciliation'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /wagering/transactions:
    post:
      tags: [Wagering]
      operationId: submitWagerTransaction
      summary: Registra uma operação do provedor
      description: |-
        Requer token do provedor. `Idempotency-Key` é obrigatório. Repetir chave
        e conteúdo retorna o resultado original; reutilizar a chave com conteúdo
        diferente retorna conflito. `OPENING` não é aceito nesta rota.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          example: 59e9f47f-86d8-44a5-a315-f688bc3f04a6
        - name: X-Correlation-ID
          in: header
          required: false
          description: Identificador de correlação; gerado pela API se omitido.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WagerRequest'
            examples:
              bet:
                summary: Aposta
                value:
                  externalTransactionId: bet-123
                  playerId: 0192f28f-5dc0-7d58-bdb2-814ad6a0f4a1
                  walletId: 0192f28f-5dc0-7d58-bdb2-814ad6a0f4a2
                  roundId: round-456
                  gameId: game-789
                  kind: BET
                  money:
                    amount: '10.00'
                    currency: BRL
              loss:
                summary: Perda sem movimentação de saldo
                value:
                  externalTransactionId: loss-123
                  playerId: 0192f28f-5dc0-7d58-bdb2-814ad6a0f4a1
                  walletId: 0192f28f-5dc0-7d58-bdb2-814ad6a0f4a2
                  roundId: round-456
                  gameId: game-789
                  kind: LOSS
                  money:
                    amount: '0.00'
                    currency: BRL
      responses:
        '200':
          description: Operação processada ou replay idempotente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WagerResult'
        '202':
          description: Operação registrada aguardando resolução de referência
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WagerResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Operação rejeitada por regra de negócio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WagerResult'
  /wagering/transactions/{transactionID}:
    parameters:
      - name: transactionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Wagering]
      operationId: getWagerTransaction
      summary: Consulta uma operação por ID interno
      responses:
        '200':
          description: Operação encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WagerResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /providers/{providerID}/wagering/transactions/{externalTransactionID}:
    parameters:
      - name: providerID
        in: path
        required: true
        schema:
          type: string
        example: local
      - name: externalTransactionID
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Wagering]
      operationId: getProviderWagerTransaction
      summary: Consulta uma operação por identificador externo do provedor
      responses:
        '200':
          description: Operação encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WagerResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acesso emitido pelo realm jungle do Keycloak.
  parameters:
    WalletID:
      name: walletID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidRequest:
      description: JSON ou parâmetros inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token ausente, inválido ou sem autorização para o recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflito de recurso ou de chave de idempotência
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [live, ready, not_ready]
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{2}$'
          example: '100.00'
          description: Valor decimal exato com duas casas; não enviar como número JSON.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: BRL
    OpenWalletRequest:
      type: object
      required: [playerId, initialBalance]
      additionalProperties: false
      properties:
        playerId:
          type: string
          format: uuid
        initialBalance:
          $ref: '#/components/schemas/Money'
    OpenWalletResponse:
      type: object
      required: [id, playerId, balance, version, openingTransactionId]
      properties:
        id:
          type: string
          format: uuid
        playerId:
          type: string
          format: uuid
        balance:
          $ref: '#/components/schemas/Money'
        version:
          type: integer
          format: int64
        openingTransactionId:
          type: string
          description: String vazia quando o saldo inicial é zero.
    Wallet:
      allOf:
        - $ref: '#/components/schemas/OpenWalletResponse'
        - type: object
          required: [createdAt, updatedAt]
          properties:
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    LedgerEntry:
      type: object
      required: [id, walletId, direction, money, balanceBefore, balanceAfter, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: ID da transação financeira associada.
        walletId:
          type: string
          format: uuid
        direction:
          type: string
          enum: [CREDIT, DEBIT]
        money:
          $ref: '#/components/schemas/Money'
        balanceBefore:
          $ref: '#/components/schemas/Money'
        balanceAfter:
          $ref: '#/components/schemas/Money'
        createdAt:
          type: string
          format: date-time
    LedgerPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        nextCursor:
          type: string
          description: Cursor opaco para buscar a próxima página; vazio quando não há mais itens.
    Reconciliation:
      type: object
      required: [walletId, storedBalance, calculatedBalance, difference, consistent, checkedEntries]
      properties:
        walletId:
          type: string
          format: uuid
        storedBalance:
          $ref: '#/components/schemas/Money'
        calculatedBalance:
          $ref: '#/components/schemas/Money'
        difference:
          $ref: '#/components/schemas/Money'
        consistent:
          type: boolean
        checkedEntries:
          type: integer
          format: int64
    WagerRequest:
      type: object
      required: [externalTransactionId, playerId, walletId, roundId, gameId, kind, money]
      additionalProperties: false
      properties:
        providerId:
          type: string
          description: Opcional; se enviado deve coincidir com o provider do token.
        externalTransactionId:
          type: string
        playerId:
          type: string
          format: uuid
        walletId:
          type: string
          format: uuid
        roundId:
          type: string
        gameId:
          type: string
        kind:
          type: string
          enum: [BET, WIN, LOSS, REFUND, ROLLBACK]
        money:
          $ref: '#/components/schemas/Money'
        referenceExternalTransactionId:
          type: string
          description: Obrigatório para REFUND e ROLLBACK; identifica uma transação do mesmo provedor.
    WagerResult:
      type: object
      required: [transactionId, status, idempotentReplay]
      properties:
        transactionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, PENDING_REFERENCE, PROCESSED, REJECTED, FAILED]
        idempotentReplay:
          type: boolean
        pending:
          type: boolean
        failureCode:
          type: string
        balance:
          $ref: '#/components/schemas/Money'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: invalid_request
        message:
          type: string
          example: request validation failed
