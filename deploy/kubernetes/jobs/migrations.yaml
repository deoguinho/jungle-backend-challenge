apiVersion: batch/v1
kind: Job
metadata:
  name: database-migrations
  namespace: jungle
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: jungle-backend:local
          imagePullPolicy: IfNotPresent
          command: ["/app/migrate"]
          args: ["up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: local-credentials
                  key: DATABASE_URL
