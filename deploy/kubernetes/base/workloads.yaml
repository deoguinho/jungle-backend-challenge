apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: jungle
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jungle-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jungle-api
    spec:
      containers:
        - name: api
          image: jungle-backend:local
          imagePullPolicy: IfNotPresent
          command: ["/app/api"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: local-dependencies
            - secretRef:
                name: local-credentials
          env:
            - name: HTTP_ADDR
              value: ":8080"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: jungle
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: jungle-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-sqs
  namespace: jungle
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jungle-worker-sqs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jungle-worker-sqs
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker-sqs
          image: jungle-backend:local
          imagePullPolicy: IfNotPresent
          command: ["/app/worker"]
          ports:
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: local-dependencies
            - secretRef:
                name: local-credentials
          env:
            - name: WORKER_KIND
              value: "sqs-consumer"
            - name: WORKER_CONCURRENCY
              value: "4"
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              memory: 512Mi
---
